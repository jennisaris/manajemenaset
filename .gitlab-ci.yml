variables:
  REGISTRY: registry-pd.dikti.go.id
  IMAGE: registry-pd.dikti.go.id/sekjen/sekjen-smartdikti/sekjen-smartdikti
  APP_DIR: /home/app01-garuda/sekjen-smartdikti

stages:
  - build
  - deploy

build:
  stage: build
  image: docker:27-cli
  tags: [dikti-runner-1]
  environment:
    name: development
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  script:
    - |
      {
        echo "APP_ENV=development"
        echo "DATABASE_URL=$DATABASE_URL"
        echo "AUTH_SECRET=$AUTH_SECRET"
        echo "DISABLE_EMAIL=$DISABLE_EMAIL"
        echo "SESSION_COOKIE_SECURE=$SESSION_COOKIE_SECURE"
      } > .env
    - docker login -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD" "$REGISTRY"
    - docker build -t "$IMAGE:dev-v1.0.$CI_PIPELINE_IID" -t "$IMAGE:dev-latest" .
    - docker push "$IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "development"
  timeout: 60m

.deploy_ssh:
  before_script:
    - |
      if ! command -v ssh >/dev/null 2>&1; then
        apk add --no-cache openssh-client
      fi
    - install -m 600 "$DEPLOY_SSH_KEY" /tmp/deploy_key
    - mkdir -p ~/.ssh && ssh-keyscan -H "$DEV_HOST" >> ~/.ssh/known_hosts 2>/dev/null
    - export S="ssh -i /tmp/deploy_key -o IdentitiesOnly=yes -p $DEV_PORT $DEV_USERNAME@$DEV_HOST"

deploy:
  stage: deploy
  image: alpine:3
  tags: [dikti-runner-1]
  environment:
    name: development
  extends: .deploy_ssh
  script:
    - |
      {
        echo "APP_ENV=development"
        echo "DATABASE_URL=$DATABASE_URL"
        echo "AUTH_SECRET=$AUTH_SECRET"
        echo "DISABLE_EMAIL=$DISABLE_EMAIL"
        echo "SESSION_COOKIE_SECURE=$SESSION_COOKIE_SECURE"
      } | $S "umask 077; cat > $APP_DIR/env.notes"
    - $S "chmod 600 $APP_DIR/env.notes"
    - $S "bash $APP_DIR/deploy-sekjen-smartdikti.sh"
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "development"
